name: Update header logo

on:
  push:
    paths:
      - '.github/workflows/update-header-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace header brand with supplied logo artwork
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old = '<div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Place au Soleil</span></div>'
          new = '<div class="brand"><img class="brand-logo" src="./assets/logo-place-au-soleil-header.svg" alt="Place au Soleil"></div>'
          if old not in html:
              raise SystemExit('Header brand markup not found; no change made.')
          index.write_text(html.replace(old, new, 1), encoding='utf-8')

          css = Path('ui.css')
          styles = css.read_text(encoding='utf-8')
          marker = '/* header-logo-20260908 */'
          override = '''\n/* header-logo-20260908 */\n.brand{display:flex!important;align-items:center!important;gap:0!important;font-size:0!important;line-height:0!important}\n.brand-logo{display:block!important;width:clamp(185px,15vw,245px)!important;height:auto!important;max-height:78px!important;object-fit:contain!important;object-position:left center!important}\n@media(max-width:850px){.brand-logo{width:175px!important;max-height:70px!important}}\n'''
          if marker not in styles:
              css.write_text(styles + override, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ui.css
          git diff --cached --quiet && exit 0
          git commit -m "Remplace le logo du header par le nouveau logo"
          git push
