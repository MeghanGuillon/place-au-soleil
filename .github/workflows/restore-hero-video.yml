name: Restore hero video

on:
  push:
    paths:
      - '.github/workflows/restore-hero-video.yml'

permissions:
  contents: write

jobs:
  restore-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Put video directly in hero and refresh PNG logo
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          version = '202609081520'

          media_css = f'<link rel="stylesheet" href="./hero-media.css?v={version}">'
          if 'hero-media.css' not in html:
              html = html.replace('</head>', media_css + '</head>', 1)

          video = f'''  <video class="hero-video" autoplay muted loop playsinline preload="auto" poster="./assets/hero-train.webp" aria-hidden="true">\n    <source src="./assets/place-au-soleil-video-hero.mp4?v={version}" type="video/mp4">\n  </video>\n'''
          marker = '<section class="hero">\n'
          if '<video class="hero-video"' not in html:
              if marker not in html:
                  raise SystemExit('Hero section marker not found')
              html = html.replace(marker, marker + video, 1)

          html = html.replace('src="./assets/logo-place-au-soleil-header.png"', f'src="./assets/logo-place-au-soleil-header.png?v={version}"', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/restore-hero-video.yml
          git add -A
          git commit -m "Restaure la vidéo du hero et force le nouveau logo PNG"
          git push
