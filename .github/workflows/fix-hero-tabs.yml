name: Ajuster hero tabs

on:
  push:
    paths:
      - '.github/workflows/fix-hero-tabs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corriger icones et fondu hero
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('ui.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('v(ar--sand)', 'var(--sand)')

          patch = '''

/* Correctif icones onglets + fondu hero */
.planner-tab svg.tab-icon,
.planner-tab .tab-icon{
  width:22px!important;
  height:22px!important;
  flex:0 0 22px!important;
  display:block!important;
  color:currentColor!important;
  background:none!important;
  overflow:visible!important;
}
.planner-tab svg.tab-icon *,
.planner-tab .tab-icon path,
.planner-tab .tab-icon line,
.planner-tab .tab-icon polyline,
.planner-tab .tab-icon circle,
.planner-tab .tab-icon rect{
  fill:none!important;
  stroke:currentColor!important;
  stroke-width:1.9!important;
  stroke-linecap:round!important;
  stroke-linejoin:round!important;
}
.planner-tab.active svg.tab-icon *,
.planner-tab.active .tab-icon path,
.planner-tab.active .tab-icon line,
.planner-tab.active .tab-icon polyline,
.planner-tab.active .tab-icon circle,
.planner-tab.active .tab-icon rect{
  stroke:var(--ink)!important;
}
.hero:after{
  bottom:-115px!important;
  height:360px!important;
  filter:blur(34px)!important;
  background:
    radial-gradient(ellipse at center,rgba(250,247,240,.94) 0%,rgba(250,247,240,.78) 42%,rgba(250,247,240,0) 74%),
    linear-gradient(180deg,rgba(250,247,240,0) 0%,rgba(250,247,240,.48) 30%,rgba(250,247,240,.95) 63%,var(--sand) 100%)!important;
}
.section:before{
  top:-175px!important;
  height:220px!important;
  filter:blur(28px)!important;
}
'''
          marker = '/* Correctif icones onglets + fondu hero */'
          if marker in css:
              css = css[:css.index(marker)].rstrip() + patch
          else:
              css = css.rstrip() + patch
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Committer les ajustements
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Corrige les icones des onglets du hero"
          file_pattern: ui.css
