name: Ajuster hero tabs

on:
  push:
    paths:
      - '.github/workflows/fix-hero-tabs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corriger onglets et fondu hero
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          route_icon = '<svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z"></path><path d="M8 17l-2 4"></path><path d="M16 17l2 4"></path><path d="M8 7h8"></path><path d="M7.5 12h.01"></path><path d="M16.5 12h.01"></path></svg><span>Planifiez votre trajet</span>'
          ticket_icon = '<svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5 14.8 3.3a2 2 0 0 1 2.7.7l2.5 4.4a2 2 0 0 1-.7 2.7L8.5 17.3a2 2 0 0 1-2.7-.7L3.3 12.2A2 2 0 0 1 4 9.5Z"></path><path d="M9 8.8l.01.01"></path><path d="M12 13.9l.01.01"></path><path d="M11 7.6l3.1 5.3"></path></svg><span>J’ai un numéro de train</span>'
          html = html.replace('>🚆 Planifiez votre trajet</button>', '>' + route_icon + '</button>')
          html = html.replace('>🎫 J’ai un numéro de train</button>', '>' + ticket_icon + '</button>')
          index.write_text(html, encoding='utf-8')

          css_path = Path('ui.css')
          css = css_path.read_text(encoding='utf-8')
          patch = base64.b64decode('').decode('utf-8')
          marker = '/* Ajustements DA hero — onglets maquette + fondu bas */'
          if marker in css:
              css = css[:css.index(marker)].rstrip() + '\n' + patch
          else:
              css = css.rstrip() + patch
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Committer les ajustements
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Ajuste les onglets du hero et le fondu"
          file_pattern: index.html ui.css
