name: Clean hero CSS loading

on:
  push:
    paths:
      - '.github/workflows/clean-hero-css.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove duplicate inline hero CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # Remove the large legacy inline stylesheet before ui.css.
          html = re.sub(
              r"<style>\s*@import url\('https://fonts\.googleapis\.com/css2\?family=Manrope:[\s\S]*?</style>\s*(?=<link rel=\"stylesheet\" href=\"\./ui\.css)",
              "",
              html,
              count=1
          )

          # Remove the second hero override stylesheet: ui.css is now the single source of truth.
          html = re.sub(
              r'<style id="hero-tab-final-overrides">[\s\S]*?</style>',
              '',
              html,
              count=1
          )

          # Keep stylesheet render-blocking and force fresh CSS.
          html = re.sub(
              r'<link rel="stylesheet" href="\./ui\.css\?v=[^"]+">',
              '<link rel="stylesheet" href="./ui.css?v=202609081515">',
              html,
              count=1
          )

          # Preload the PNG logo too, after hero preload.
          if 'href="./assets/logo-place-au-soleil-header.png"' not in html.split('</head>',1)[0]:
              html = html.replace(
                  '<link rel="preload" as="image" href="./assets/hero-train.webp" fetchpriority="high">',
                  '<link rel="preload" as="image" href="./assets/hero-train.webp" fetchpriority="high">\n<link rel="preload" as="image" href="./assets/logo-place-au-soleil-header.png" fetchpriority="high">',
                  1
              )

          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/clean-hero-css.yml
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Stabilise le chargement du hero"
          git push
