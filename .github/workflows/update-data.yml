name: Mise à jour des données SNCF

on:
  schedule:
    - cron: '0 3 * * *'   # tous les jours à 3h UTC
  workflow_dispatch:        # bouton "Run workflow" pour lancer manuellement

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      - name: Générer les données
        run: python scripts/build_data.py

      - name: Committer les changements
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Mise à jour automatique des données SNCF"
          file_pattern: data/routes.json
